<!DOCTYPE html>
<!-- Daily Paper Digest, Drive variant: filled by Claude on claude.ai (no script), see the newsletter-papers-drive
     skill. Replace every {{...}} and repeat the block between the CARD comments once per paper, in order. Light
     colours only, inline styles, nothing else to load. -->
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Daily Paper Digest</title>
<style>:root{color-scheme:light only;supported-color-schemes:light}</style>
</head>
<body bgcolor="#f4f5f8" style="margin:0; padding:0; background-color:#f4f5f8; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1a1f2e;">
<div style="display:none; max-height:0; overflow:hidden;">{{t_issue}} #{{issue}} &middot; {{count}} {{t_new}} &middot; {{date}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f5f8" style="background-color:#f4f5f8;">
<tr><td align="center" style="padding:24px 12px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%; max-width:640px; background-color:#ffffff; border:1px solid #26343A; border-left:4px solid #c2603d; border-radius:8px;">

  <!-- HEADER -->
  <tr><td style="padding:22px 24px 18px;">
    <div style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#c2603d; font-weight:600;">Daily Paper Digest</div>
    <div style="font-size:22px; font-weight:300; color:#1a1f2e; margin-top:6px;">{{t_issue}} #{{issue}}</div>
    <div style="font-size:13px; color:#6b7390; margin-top:6px;">{{t_review}} {{date}} &middot; {{count}} {{t_new}}</div>
  </td></tr>
  <tr><td style="padding:0 24px;"><div style="border-top:1px solid #e3e6eb;"></div></td></tr>

  <!-- CARD: one per paper, in order; remove the comments -->
  <tr><td style="padding:18px 24px 6px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td width="28" valign="top" style="width:28px; font-size:18px; font-weight:300; color:#8f95aa; padding-top:1px;">{{number}}</td>
        <td valign="top">
          <div style="font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:#9a4424; font-weight:600;">{{label}}</div>
          <div style="font-size:16px; line-height:21px; font-weight:600; margin-top:4px;"><a href="{{url}}" style="color:#1a1f2e; text-decoration:none;">{{title}}</a></div>
          <div style="font-size:12px; color:#6b7390; margin-top:5px;">{{authors}} &middot; {{source}} &middot; {{t_published}} {{published}}</div>
          <div style="font-size:13.5px; line-height:19px; color:#2f3546; margin-top:9px;">{{abstract}}</div>
          <div style="font-size:12px; margin-top:8px;"><a href="{{url}}" style="color:#c2603d; text-decoration:none;">{{t_read}} &rarr;</a></div>
        </td>
      </tr>
    </table>
    <div style="border-top:1px solid #eaeffc; margin-top:16px;"></div>
  </td></tr>
  <!-- END CARD -->

  <!-- FOOTER -->
  <tr><td style="padding:14px 24px 22px; font-size:11.5px; line-height:16px; color:#8f95aa;">
    {{t_footer}} <a href="mailto:{{owner}}" style="color:#6b7390;">{{owner}}</a>.
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
