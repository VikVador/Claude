<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 84" role="img" aria-label="Liège université">

  <!-- Mark: triangles of the ULiège logo, column by column (x = 25 to 85) -->
  <g id="mark">

    <!-- Left column (x 25 to 40) -->
    <polygon points="25,10 40,18.5 25,27"     fill="#c8c5bb"/>
    <polygon points="25,27 40,36 25,44.5"     fill="#ffda55"/>
    <polygon points="25,44.5 40,53.5 25,62"   fill="#f39435"/>

    <!-- Second column (x 40), pointing left -->
    <polygon points="40,18.5 40,36 25,27"     fill="#e8e7df"/>
    <polygon points="40,36 40,53.5 25,44.5"   fill="#f8bd35"/>
    <polygon points="40,53.5 40,71 25,62"     fill="#ec5a39"/>

    <!-- Third column (x 40 to 55), pointing right -->
    <polygon points="40,18.5 55,27 40,36"     fill="#d4ddbd"/>
    <polygon points="40,36 55,44.5 40,53.5"   fill="#80bd49"/>
    <polygon points="40,53.5 55,62 40,71"     fill="#008d88"/>

    <!-- Fourth column (x 55), pointing left -->
    <polygon points="55,27 55,44.5 40,36"     fill="#a6c770"/>
    <polygon points="55,44.5 55,62 40,53.5"   fill="#36a657"/>
    <polygon points="55,62 55,79.5 40,71"     fill="#00768b"/>

    <!-- Bottom right (x 55 to 85) -->
    <polygon points="55,62 70,53.5 70,71"     fill="#5995bb"/>
    <polygon points="55,62 70,71 55,79.5"     fill="#273d80"/>
    <polygon points="70,53.5 85,62 70,71"     fill="#71549a"/>
    <polygon points="70,53.5 85,45 85,62"     fill="#afa0c6"/>

    <!-- Top right (x 70 to 85) -->
    <polygon points="70,18.5 85,10 85,27"     fill="#78aeb6"/>
    <polygon points="70,18.5 85,27 70,36"     fill="#008598"/>

  </g>

  <!-- Wordmark -->
  <g id="wordmark" fill="#087c89" font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="40" font-size="40" font-weight="750" letter-spacing="-1.2">LIÈGE</text>
    <text x="97" y="63" font-size="25" font-weight="600" letter-spacing="-0.6">université</text>
  </g>

</svg>
